name = "iptv-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
send_metrics = false

# Opaque frame relay. No storage, no logs of frame contents or IPs.
[observability]
enabled = false

# Top-level vars are what `wrangler dev` uses; `[env.production]` does not inherit them.
# The timer overrides RELAY_TTL_UNPAIRED_MS, RELAY_TTL_MAX_MS and RELAY_IDLE_MS are set only by
# the `dev` script (`wrangler dev --var ...`); unset means the production values.
[vars]
ALLOWED_ORIGINS = "http://localhost:5174,http://localhost:5173"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[migrations]]
tag = "v1"
# SQLite-backed class so the free plan can deploy it. The relay never writes storage.
new_sqlite_classes = ["Session"]

# New-session limit shared across isolates (Workers Rate Limiting). Keyed by a truncated SHA-256 of
# the client's IPv4 address or IPv6 /64; the per-isolate in-memory limiter stays as the first line,
# and the code falls back to it when this binding is missing. Bindings are not inherited by
# `[env.production]`, which repeats it below. `wrangler dev` simulates it locally.
[[ratelimits]]
name = "NEW_SESSION_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[dev]
ip = "127.0.0.1"
port = 8787

# Production: `pnpm relay:deploy` runs `wrangler deploy --env production`.
[env.production]

[env.production.observability]
enabled = false

[env.production.vars]
# The companion page (`pnpm companion:deploy`), then the localhost entries: TV dev builds on this computer
# (`pnpm dev` serves 5173; 5180 is a second local TV dev server) that pair through the production relay.
# The Origin check is hygiene only (any non-browser client can send any Origin); security comes from the
# end-to-end encryption.
ALLOWED_ORIGINS = "https://saqqezy-companion.sacco-rezais.workers.dev,http://localhost:5173,http://localhost:5180"
# Add hosted TV origins to the same comma-separated list (hosted TV web builds such as Titan OS, and any
# other TV build served over https).
# Packaged Tizen/webOS builds send Origin null or file://, which role=tv accepts without a listing.

[[env.production.durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[env.production.ratelimits]]
name = "NEW_SESSION_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
